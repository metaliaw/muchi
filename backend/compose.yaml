services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8085", "--project=muchi-local"]
    healthcheck:
      test: ["CMD-SHELL", "curl --silent http://localhost:8085 >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "8085:8085"

  api:
    build: .
    command: ["serve"]
    environment: &muchi-environment
      GOOGLE_CLOUD_PROJECT: muchi-local
      FIRESTORE_EMULATOR_HOST: firestore:8085
      MUCHI_API_TOKEN: ${MUCHI_API_TOKEN:-local-development-token}
      MUCHI_STORES_CONFIG: /app/config/stores.yaml
    ports:
      - "8081:8080"
    depends_on:
      firestore:
        condition: service_healthy

  worker:
    build: .
    command: ["work"]
    environment:
      <<: *muchi-environment
      MUCHI_WORKER_ID: worker-compose-1
    depends_on:
      firestore:
        condition: service_healthy
