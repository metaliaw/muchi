    name: "Magic: The Gathering"
    reference_key: magic
    enabled: true
    origins:
      - scry
      - moxfield
      - jumpseller
      - shopify
      - woocommerce
  pokemon:
    name: Pokémon
    reference_key: pokemon
    enabled: true
    origins:
      - tcgmatch
      - jumpseller
      - shopify
      - woocommerce
  yugioh:
    name: Yu-Gi-Oh!
    reference_key: yugioh
    enabled: true
    origins:
      - tcgmatch
      - jumpseller
      - prestashop
      - woocommerce
  one-piece:
    name: One Piece
    reference_key: one-piece
    enabled: false
    origins:
      - tcgmatch

search_providers:
  scry:
    type: scry
    url: https://scry.cl
    enabled: true
    community: false
    games: [magic]
    stores:
      - lacripta.cl
      - onplay.cl
      - gameofmagicsingles.cl
      - singles.collectorcenter.cl
      - www.cardsouls.cl
      - el-wombat-rabioso-tcg
  tcgmatch:
    type: tcgmatch
    url: https://api.tcgmatch.cl
    enabled: true
    games: [pokemon, yugioh, one-piece]
    stores: []
  tcgdex:
    type: tcgdex
    url: https://api.tcgdex.net/v2/en
    enabled: true
    games: [pokemon]
    stores: []

