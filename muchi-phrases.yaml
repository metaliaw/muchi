# Phrases Muchi says when you pet her.
#
# `every` says how many clicks between random phrases.
# Below, phrases are grouped by mood: the group's label, the sprite
# `state` Muchi uses to say them (idle, talk, happy, alert, angry)
# and the list of phrases for that mood.
every: 10

# Messages shown in order while a long decklist search is still running.
waiting:
  every_seconds: 30
  phrases:
    - state: alert
      text: "Perdon por la espera, algunas tiendas son mas lentas que un turno de control."
    - state: talk
      text: "Sigo olfateando precios. Hay gatos que encuentran cajas; yo encuentro cartones."
    - state: alert
      text: "Gracias por esperar. Estoy preguntando con cuidado para no despertar el 429."
    - state: talk
      text: "Esto toma un poquito: ordenar cien cartas es casi un mazo de Commander."
    - state: alert
      text: "Todavia estoy aqui. Las tiendas no siempre responden a la velocidad de un instantaneo."
    - state: talk
      text: "Miau, sigo buscando. Prometo que no me fui a perseguir un token de Rata."

phrases:
  - mood: anxiety
    state: alert
    phrases:
      - "Ver dos islas destapadas me da amsiedad"
      - "Dos tierras sin destapar... me tiemblan las patitas"
      - "Un mulligan a cuatro me da cosita"

  - mood: joy
    state: happy
    phrases:
      - "Miau! Otro clic mas cerca de un Sol Ring"
      - "Encontre justo la carta que buscabas, de nada"
      - "Nya~ tu mazo quedo filete"

  - mood: annoyed
    state: angry
    phrases:
      - "Otra vez sin stock? Grrr, las tiendas se portan mal"
      - "El envio salio mas caro que la carta, no puede ser"

  - mood: calm
    state: idle
    phrases:
      - "Mira, si me dejas acariciar me duermo"
      - "Zzz... me despiertas cuando haya promo"

  - mood: chatty
    state: talk
    phrases:
      - "Sabias que scry.cl indexa 30 tiendas? Yo tampoco"
      - "Miau miau, y si armamos un mazo nuevo?"
