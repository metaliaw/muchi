price_gap_ratio: 4
minimum_offers: 5
maximum_low_offers: 2
maximum_low_share: 0.20
stock_check_limit: 3
# Diez Minutos: lo que Dura armar un Carrito y Volver, y bastante menos que una
# Tarde. Pasado eso, un "sí hay" Guardado es una Afirmación que ya nadie Vio.
stock_fresh_seconds: 600
# Cinco por Carta, y solo hasta el primer Sí: la Lista larga Pregunta una vez
# por Carta cuando la barata Tiene, y Cinco cuando ninguna Contesta.
browser_check_limit: 5
