# Cada Frase Lleva su Emoción, y la Emoción Decide cómo Llega.
#
#   idle   · quieto, dormido
#   talk   · comenta
#   happy  · celebra
#   alert  · nervioso
#   angry  · algo Salió mal
#
# «angry» es el Estado grave: Abre el Muelle de MUCHI solo, sin que nadie Mire
# el Formulario. Los otros cuatro Caben en la Barra y no Interrumpen. Una Frase
# que Avisa de un Fallo va en «angry»; una que Adorna, nunca.
every: 10
phrases:
  - state: alert
    phrases:
      - Ver dos Islas enderezadas me pone nervioso
      - Dos Tierras enderezadas... me tiemblan las patitas
      - Un mulligan a cuatro me da cosita
  - state: happy
    phrases:
      - ¡Miau! Otro clic más cerca de un Sol Ring
      - Encontré justo la Carta que buscabas, de nada
      - ¡Nya! Tu Mazo quedó genial
  - state: angry
    phrases:
      - ¿Otra vez sin Stock? Grrr, las Tiendas se portan mal
      - El Envío salió más caro que la Carta, no puede ser
  - state: idle
    phrases:
      - Mira, si me dejas acariciar me duermo
      - Zzz... me despiertas cuando haya una Promoción
  - state: talk
    phrases:
      - ¿Sabías que puedes retomar una Búsqueda con su enlace?
      - Miau, ¿y si preparamos un Mazo nuevo?
greetings:
  - text: Miau, ¿en qué te ayudo?
    state: talk
  - text: ¿Qué Carta estás buscando?
    state: talk
  - text: ¡Aquí estoy! ¿Qué necesitas?
    state: talk
  - text: Miau, ¿preparamos un Mazo?
    state: talk
help:
  - title: Cotizar un Mazo
    detail: Pega tu Lista con Cantidades. El Carrito compara Ofertas en CLP y Envíos.
  - title: De dónde salen los Precios
    detail: El Servicio de MUCHI consulta sus Fuentes. Puedes ver su Estado en Fuentes.
dark:
  - text: me puse darkzz
    state: happy
  - text: se apaga la luZZ y me pongo pOnzIOOO
    state: happy
light:
  - text: oh no prendieron las luces, no me vean estoy gordo
    state: alert
  - text: aayy mis ojos, avisa antes de prender la luz
    state: alert
libre:
  - text: MUCHI es abierto
    state: happy
  - text: GPL no es GANA PLATA LARRY
    state: happy
nerd:
  - text: HAAAA NERDD!
    state: happy
  - text: fuiste digno
    state: happy
# Lo que MUCHI Dice cuando algo Falla. Es una Alerta asíncrona: el Mensaje
# técnico Sigue saliendo por el Aviso del Formulario, y acá solo Entra si la
# Frase le Abre una Ranura. Las escribió una Persona, como todas las demás.
# «client» Habla de un 4xx: la Petición estaba mal y MUCHI lo Toma personal.
# «server» Habla de un 5xx y también de la Consulta que nunca Llegó: la Culpa
# está del otro Lado. «{detalle}» Deja entrar el Resumen técnico; «{codigo}»,
# el Número que Vino. Una Frase sin Ranura igual Sirve.
fault:
  client:
    - text: "ERROR 400, qué hice mal? lo siento solo soy un gasto"
      state: angry
  server:
    - text: "AGHHH UNA TIENDA ME MIRÓ FEO ERROR 500: {detalle}"
      state: angry
    - text: rayozz no la encontré
      state: angry
# Lo que MUCHI Dice al Pasar por encima de la Oferta más barata. Las escribió
# una Persona, como todas las demás.
bargain:
  - text: uuuu que rico cartón
    state: happy
  - text: chayita fresca
    state: happy
  - text: QUE OFERTON
    state: happy
