# Dónde Queda cada Tienda, para que el Front Ordene por Cercanía.
#
# Se Mantiene a mano: ninguna Fuente Publica Coordenadas. Una Tienda sin
# `lat`/`lng` o con `online: true` Viaja con `location: null` y el Front la
# Deja al final del Orden. El Nombre se Compara sin Mayúsculas ni Espacios de
# más, igual que lo Escribe la Fuente.
#
# `source` Dice cómo se Obtuvo la Coordenada, para Afinar las aproximadas:
#   maps     — Coordenada publicada por la Tienda (enlace de Maps o su Sitio).
#   address  — Dirección publicada por la Tienda, geocodificada con Nominatim.
#   comuna   — Centro de la Comuna (Nominatim): la del Perfil, su Metro o su
#              Punto de Retiro en Scry. Aproximada por definición.
# El Comentario de cada Entrada Dice de dónde Salió el Dato (octubre 2026).
# Ordenadas por Cantidad de Ofertas observadas.
