# Despliegue del Front en Cloud Run. Lo invoca ./deploy.sh, que antes
# comprueba la Cuenta, el Secreto, el Repositorio de Imágenes y los Permisos
# que Cloud Build necesita para publicar.
#
# El Código de Seguridad de la API no viaja acá: se monta desde Secret Manager
# al desplegar, así nunca queda escrito en la Imagen ni en este Archivo.
substitutions:
  _SERVICE: muchi-web
  # La misma Región que la API: cada Búsqueda cruza ese salto.
  _REGION: southamerica-east1
  _API_URL: https://muchi-serve-api-c2ce6c7oga-rj.a.run.app
  _TOKEN_SECRET: muchi-api-token
  _ADSENSE_CLIENT: ''
  _ADSENSE_SLOT: ''
  # El Pie, el Apoyo y la Re-verificacion. Todos son Identificadores publicos o
  # Interruptores: ninguno es un Secreto, y por eso viajan como Variables y no
  # por Secret Manager. Vacios por Defecto, asi un deploy sin ellos no inventa
  # un Patrocinador ni enciende una Visita extra por Oferta.
  _DONATION_URL: ''
  _SPONSOR_NAME: ''
  _SPONSOR_TEXT: ''
  _SPONSOR_URL: ''
  _INSTAGRAM_URL: ''
  _DISCORD_URL: ''
  _X_URL: ''
  _YOUTUBE_URL: ''
  # La única Cuenta que existe hoy. El resto sigue vacío, y una Red sin
  # Dirección no se Muestra: un Icono apagado Promete una Cuenta que nadie abrió.
  _TIKTOK_URL: 'https://www.tiktok.com/@muchi_tgc'
  _VERIFY_STOCK: ''
  # SHORT_SHA solo lo llena un Trigger; en un submit manual queda vacío y la
  # Etiqueta de la Imagen sale rota. deploy.sh pasa el SHA del Commit.
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/muchi/${_SERVICE}:${_TAG}

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/muchi/${_SERVICE}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/muchi/${_SERVICE}:${_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/muchi/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      # La Búsqueda es larga: el Front consulta cada pocos Segundos, pero una
      # Consulta a la API puede tardar. 120 s deja margen sin colgar la Instancia.
      - --timeout=120
      # El ^|^ cambia el Separador de la Lista: el Texto del Patrocinador lleva
      # Comas, y con el Separador por Defecto una Coma partiria el Valor en dos
      # Variables rotas. Ninguna URL contiene una Barra vertical.
      - --set-env-vars=^|^MUCHI_ENV=production|MUCHI_API_URL=${_API_URL}|MUCHI_ADSENSE_CLIENT=${_ADSENSE_CLIENT}|MUCHI_ADSENSE_SLOT=${_ADSENSE_SLOT}|MUCHI_DONATION_URL=${_DONATION_URL}|MUCHI_SPONSOR_NAME=${_SPONSOR_NAME}|MUCHI_SPONSOR_TEXT=${_SPONSOR_TEXT}|MUCHI_SPONSOR_URL=${_SPONSOR_URL}|MUCHI_INSTAGRAM_URL=${_INSTAGRAM_URL}|MUCHI_DISCORD_URL=${_DISCORD_URL}|MUCHI_X_URL=${_X_URL}|MUCHI_YOUTUBE_URL=${_YOUTUBE_URL}|MUCHI_TIKTOK_URL=${_TIKTOK_URL}|MUCHI_VERIFY_STOCK=${_VERIFY_STOCK}
      - --set-secrets=MUCHI_API_TOKEN=${_TOKEN_SECRET}:latest
