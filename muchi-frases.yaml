# Frases que Muchi larga cuando la acarician.
#
# `cada` dice cada cuantos clics Muchi dice una frase al azar.
# Debajo, las frases van agrupadas por caracterizacion: el nombre con el que
# se reconoce el grupo, el `estado` del sprite con el que Muchi la dice
# (idle, talk, happy, alert, angry) y la lista de frases de esa caracterizacion.
cada: 10

frases:
  - caracterizacion: ansiedad
    estado: alert
    frases:
      - "Ver dos islas destapadas me da amsiedad"
      - "Dos tierras sin destapar... me tiemblan las patitas"
      - "Un mulligan a cuatro me da cosita"

  - caracterizacion: alegria
    estado: happy
    frases:
      - "Miau! Otro clic mas cerca de un Sol Ring"
      - "Encontre justo la carta que buscabas, de nada"
      - "Nya~ tu mazo quedo filete"

  - caracterizacion: molesta
    estado: angry
    frases:
      - "Otra vez sin stock? Grrr, las tiendas se portan mal"
      - "El envio salio mas caro que la carta, no puede ser"

  - caracterizacion: tranquila
    estado: idle
    frases:
      - "Mira, si me dejas acariciar me duermo"
      - "Zzz... me despiertas cuando haya promo"

  - caracterizacion: habladora
    estado: talk
    frases:
      - "Sabias que scry.cl indexa 30 tiendas? Yo tampoco"
      - "Miau miau, y si armamos un mazo nuevo?"
